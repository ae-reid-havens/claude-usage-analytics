name: Validate model pricing

on:
  push:
    paths:
      - modelPricing.json
  pull_request:
    paths:
      - modelPricing.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate modelPricing.json
        run: |
          set -euo pipefail
          # Valid JSON with a "default" fallback entry
          jq -e 'has("default")' modelPricing.json
          # Every entry has four positive numeric rates: output >= input,
          # cache read below input, cache write at or above input
          jq -e '
            to_entries
            | all(.value
                | (.input | type == "number" and . > 0)
                  and (.output | type == "number" and . > 0)
                  and (.cacheRead | type == "number" and . > 0)
                  and (.cacheWrite | type == "number" and . > 0)
                  and (.output >= .input)
                  and (.cacheRead < .input)
                  and (.cacheWrite >= .input))
          ' modelPricing.json
      - name: Check current models have explicit entries
        run: |
          set -euo pipefail
          # Each current model ID must be its own key, so the lookup never sends it to
          # an older entry or a family fallback. The rates themselves are kept in step
          # with Anthropic's pricing page by the weekly pricing update, not pinned here.
          check() {
            jq -e --arg id "$1" '.[$id] | has("input") and has("output") and has("cacheRead") and has("cacheWrite")' modelPricing.json > /dev/null \
              || { echo "::error::$1 has no complete entry in modelPricing.json"; exit 1; }
            echo "ok $1"
          }
          check claude-fable-5-1
          check claude-mythos-5-1
          check claude-opus-5-5
          check claude-sonnet-5-5
          check claude-haiku-5-5
